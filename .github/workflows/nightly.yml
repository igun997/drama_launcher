name: nightly

# Build APK bertanda tangan dari branch main setiap malam (00:00 WIB) dan terbitkan
# sebagai pra-rilis "nightly". Bisa juga dijalankan manual (Actions > nightly > Run workflow).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bangun walau tidak ada commit baru"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ada commit baru sejak nightly terakhir?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view nightly --json body --jq .body 2>/dev/null | grep -oE 'commit: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)
          now=$(git rev-parse HEAD)
          echo "sha=$now" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$now" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada commit baru ($now); dilewati."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.changed.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.changed.outputs.build == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analisis dan tes
        if: steps.changed.outputs.build == 'true'
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Siapkan kunci tanda tangan
        if: steps.changed.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK (rilis, per ABI)
        if: steps.changed.outputs.build == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Verifikasi tanda tangan dan beri nama
        if: steps.changed.outputs.build == 'true'
        run: |
          mkdir -p dist
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          date=$(date -u +%Y%m%d)
          short=$(git rev-parse --short HEAD)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$src" ] || continue
            out="dist/drama_launcher-nightly-$date-$short-$abi.apk"
            cp "$src" "$out"
            "$BT/apksigner" verify --print-certs "$out" | grep -E "Verifies|SHA-256"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          rm -f android/key.properties android/app/upload-keystore.jks

      - name: Terbitkan pra-rilis nightly
        if: steps.changed.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build otomatis dari main. Ditandatangani kunci rilis proyek.

          commit: ${{ steps.changed.outputs.sha }}
          Pasang APK sesuai CPU (kebanyakan tablet/HP baru: arm64-v8a)."
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/* --prerelease --target main \
            --title "Nightly $(date -u +%Y-%m-%d)" --notes "$notes"
