name: dracin_launcher
description: Launcher minimalis untuk penonton drama Tiongkok, dengan pengingat tayang dan istirahat mata.
homepage: https://www.ciptadusa.com
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
